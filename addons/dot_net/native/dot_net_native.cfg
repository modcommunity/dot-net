; Loaded at run time by DotNetNative, never by the editor: a ".gdextension" file would load on every client.
[configuration]

entry_symbol = "dot_net_native_init"
compatibility_minimum = "4.7"
reloadable = false

[libraries]

linux.debug.x86_64 = "bin/libdot_net_native.linux.template_debug.x86_64.so"
linux.release.x86_64 = "bin/libdot_net_native.linux.template_release.x86_64.so"
linux.debug.arm64 = "bin/libdot_net_native.linux.template_debug.arm64.so"
linux.release.arm64 = "bin/libdot_net_native.linux.template_release.arm64.so"
windows.debug.x86_64 = "bin/libdot_net_native.windows.template_debug.x86_64.dll"
windows.release.x86_64 = "bin/libdot_net_native.windows.template_release.x86_64.dll"
macos.debug = "bin/libdot_net_native.macos.template_debug.universal.dylib"
macos.release = "bin/libdot_net_native.macos.template_release.universal.dylib"
